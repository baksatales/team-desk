<style>
:root{
  --bg:#F2F4F7; --paper:#FFFFFF; --ruling:#E4E9F0; --line:#D3DAE4;
  --ink:#1E2640; --ink-2:#56607C; --ink-3:#8A93AA;
  --bahi:#7A1218; --bahi-ink:#FFF4F0; --bahi-soft:#F7E6E5;
  --marigold:#D98A06; --marigold-soft:#FBEFD6; --leaf:#2F6B45; --leaf-soft:#E2F0E6;
  --warn:#A1311B;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131B; --paper:#181C27; --ruling:#232938; --line:#2E3546;
    --ink:#E8EBF3; --ink-2:#AAB2C7; --ink-3:#7A8299;
    --bahi:#5C0E13; --bahi-ink:#FFECE8; --bahi-soft:#3A1A1C;
    --marigold:#F0A93A; --marigold-soft:#3A2E17; --leaf:#5FB07D; --leaf-soft:#1C3125; --warn:#F07D63;
  }
}
:root[data-theme="dark"]{
  --bg:#10131B; --paper:#181C27; --ruling:#232938; --line:#2E3546;
  --ink:#E8EBF3; --ink-2:#AAB2C7; --ink-3:#7A8299;
  --bahi:#5C0E13; --bahi-ink:#FFECE8; --bahi-soft:#3A1A1C;
  --marigold:#F0A93A; --marigold-soft:#3A2E17; --leaf:#5FB07D; --leaf-soft:#1C3125; --warn:#F07D63;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* Cover: the red ledger binding */
.cover{background:var(--bahi);color:var(--bahi-ink);padding:18px 20px 0;position:relative}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 9px)}
.cover-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:0}
.brand small{display:block;font:400 .82rem/1.3 var(--body);opacity:.8;letter-spacing:0}
.me{display:flex;gap:8px;align-items:center;font-size:.9rem}
.me select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--bahi-ink);border-radius:8px;padding:6px 10px}
.me select option{color:#1E2640}
.signout{background:none;border:1px solid rgba(255,255,255,.35);color:var(--bahi-ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.gate{max-width:460px;margin:40px auto;text-align:center}.gate .btn{font-size:1.05rem;padding:10px 18px}
.tabs{display:flex;gap:4px;max-width:1180px;margin:16px auto 0;overflow-x:auto;padding-bottom:6px}
.tab{background:none;border:0;color:var(--bahi-ink);opacity:.75;padding:10px 14px 12px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.period{display:flex;align-items:center;gap:6px}
.period h2{font-family:var(--display);font-size:1.6rem;margin:0 8px;letter-spacing:-.015em}
.iconbtn,.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer}
.iconbtn{padding:7px 11px}
.btn.primary{background:var(--bahi);border-color:var(--bahi);color:var(--bahi-ink);font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.small{padding:4px 9px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.sheet h3{font-family:var(--display);font-size:1.15rem;margin:0 0 4px}
.muted{color:var(--ink-2)}
.tiny{font-size:.83rem;color:var(--ink-3)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}

/* Budget strip: the week as an hours ledger */
.budget{margin:12px 0 4px}
.budget-track{position:relative;height:18px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--ruling) 0 1px,transparent 1px 100%);background-size:calc(100%/var(--cols,32)) 100%;border:1px solid var(--line);overflow:hidden;display:flex}
.budget-track span{height:100%}
.budget-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.budget-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:.88rem;margin-top:6px}
.over{color:var(--warn);font-weight:700}

/* Ledger list */
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--ruling)}
.ledger li:last-child{border-bottom:0}
.ledger li.compact{grid-template-columns:24px 1fr auto}
.ledger .t{cursor:pointer;min-width:0}
.ledger .t b{font-weight:400}
.ledger .meta{font-size:.82rem;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.ledger .done .t b{text-decoration:line-through;color:var(--ink-3)}
.ledger .gone{opacity:.55}
.ctrls{display:flex;gap:4px;align-items:center}
.ctrls select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 4px;font-size:.82rem;max-width:118px}
.star{border:0;background:none;cursor:pointer;font-size:1.1rem;color:var(--ink-3);padding:2px 6px;line-height:1}
.star[aria-pressed="true"]{color:var(--marigold)}
.star.del{font-size:1.25rem}.star.del:hover{color:var(--warn)}
.toast-act{margin-left:12px;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;cursor:pointer;font-weight:700}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--leaf)}
.focus{background:var(--marigold-soft);border:1px solid color-mix(in srgb,var(--marigold) 40%,transparent);border-radius:10px;padding:10px 14px;margin:14px 0}
.focus h4,.group h4{margin:6px 0 2px;font-family:var(--display);font-size:1rem}
.group{margin-top:14px}
.group h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.group h4 span{font:400 .85rem var(--body);color:var(--ink-2)}
.add{display:grid;grid-template-columns:1fr 150px 70px 90px auto;gap:6px;margin-top:12px}
.add input,.add select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 9px;min-width:0}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);background:var(--paper)}
.banner.warn{border-color:var(--warn);background:var(--bahi-soft)}
.people-cards .sheet{margin:0}
.person-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person-head h3 button{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.15rem}
.person-head h3 button:focus-visible{outline:3px solid var(--marigold)}

/* Goals */
.goal{padding:12px 0;border-bottom:1px solid var(--ruling)}
.goal:last-child{border-bottom:0}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal-title{cursor:pointer;font-weight:700}
.pbar{height:8px;border-radius:4px;background:var(--ruling);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--leaf)}
.status{font-size:.78rem;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line)}
.status.on{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.status.risk{background:var(--bahi-soft);color:var(--warn);border-color:transparent}
.status.done{background:var(--ink);color:var(--paper);border-color:transparent}
.cur{width:80px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--paper)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:6px 0 16px}
.months button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 0;cursor:pointer;font-size:.8rem;line-height:1.2}
.months button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.months button small{display:block;color:var(--ink-3);font-size:.7rem}
.months button[aria-current="true"] small{color:inherit;opacity:.75}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;background:var(--paper)}

table{border-collapse:collapse;width:100%;font-size:.92rem}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ruling);vertical-align:top}
th{font-weight:700;color:var(--ink-2);font-size:.85rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);min-height:64px}
.rules li{margin:4px 0}

dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(10,15,30,.35)}
dialog::backdrop{background:rgba(16,19,27,.5)}
dialog form{padding:20px}
dialog h3{font-family:var(--display);margin:0 0 12px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:.85rem;color:var(--ink-2);font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);width:100%}
.field.check{grid-template-columns:auto 1fr;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.empty{text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:20;max-width:90vw}
@media (max-width:640px){
  .add{grid-template-columns:1fr 1fr}
  .add input:first-child{grid-column:1/-1}
  .ledger li{grid-template-columns:24px 1fr}
  .ledger .ctrls{grid-column:2}
  .months{grid-template-columns:repeat(6,1fr)}
  .period h2{font-size:1.3rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="cover">
  <div class="cover-top">
    <h1 class="brand">Team Desk <small>Baksa Tales × Conscious India · year → month → week</small></h1>
    <div class="me"><label>I am <select id="me" aria-label="Who is using this"></select></label><button id="signout" class="signout" hidden>Sign out</button></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="view" aria-live="polite" data-build="web-1"><p class="muted">Opening the desk…</p></main>
<dialog id="dlg"></dialog>

<script>
(function(){
const STATUSES=[["todo","To do"],["doing","Doing"],["waiting","Waiting on someone"],["done","Done"],["next","Next week"],["dropped","Dropped"]];
const ACTIVE=new Set(["todo","doing","waiting","done"]);
const GOAL_ST=[["on","On track"],["risk","At risk"],["done","Done"],["parked","Parked"]];
const DAYS=["","Mon","Tue","Wed","Thu","Fri","Sat"];
const GROUPS=["Conscious India","Baksa Tales","Other work","Life & growth"];
const TABS=[["week","This week"],["month","Month"],["year","Year 1"],["team","Team & engines"],["review","Friday review"]];

const S={people:{},projects:{},goals:{},tasks:{},reviews:{},settings:{}};
let db=null, fs=null, authUser=null, authReady=false, setupNeeded=false, denied=false, subs=[], readOnly=false, ready=false, taskUnsub=null, taskWin="";

// ---------- local prefs ----------
const store={get(k,d){try{const v=localStorage.getItem("desk:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("desk:"+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const weekMonth=w=>addDays(w,3).slice(0,7);
const addMonths=(m,n)=>{const d=parse(m+"-01");d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
const fmtDay=s=>parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const fmtMonth=m=>parse(m+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const fmtMon=m=>parse(m+"-01").toLocaleDateString("en-IN",{month:"short"});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const hrs=n=>(Math.round(n*100)/100).toString().replace(/\.0+$/,"")+"h";
const clean=o=>{const r={};for(const[k,v]of Object.entries(o)){if(k!=="id"&&v!==undefined)r[k]=v}return r};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const startWeek=(()=>{const n=new Date(),w=iso(monday(n));return n.getDay()===0||n.getDay()===6?addDays(w,7):w})();
const ui={tab:store.get("tab","week"),week:startWeek,month:store.get("month",null),who:store.get("who","all"),groupBy:store.get("groupBy","day"),me:store.get("me","")};
ui.month=weekMonth(ui.week);

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="value"||k==="checked"||k==="selected")e[k]=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function toast(msg,action){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=h("div",{class:"toast",role:"status"},msg,action?h("button",{class:"toast-act",onclick:()=>{t.remove();action.fn()}},action.label):null);document.body.append(t);setTimeout(()=>t.remove(),action?6000:3200)}

// ---------- sorted accessors ----------
const people=()=>Object.values(S.people).sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name));
const projects=()=>Object.values(S.projects).sort((a,b)=>GROUPS.indexOf(a.group)-GROUPS.indexOf(b.group)||(a.order??99)-(b.order??99));
const pName=id=>S.people[id]?.name||"Unassigned";
const proj=id=>S.projects[id]||{name:"No project",color:"#8A93AA",group:"Other work"};
const settings=()=>({yearStart:"2026-10",yearLabel:"Year 1",...S.settings});
const tasksFor=(pid,week)=>Object.values(S.tasks).filter(t=>t.week===week&&(!pid||t.owner===pid));
const isProt=t=>!!(S.projects[t.project]||{}).protected;
const planned=list=>list.filter(t=>ACTIVE.has(t.status)&&!isProt(t)).reduce((s,t)=>s+num(t.hours),0);
function capacity(p){const c=num(p.capacity||0),b=num(p.buffer??15);return{total:c,avail:c*(1-b/100),buffer:b}}

// ---------- writes ----------
async function save(col,id,data,merge){
  if(!db||readOnly){toast("Changes can't be saved in this view.");return false}
  try{const ref=db.collection(col).doc(id);merge?await ref.update(data):await ref.set(data);return true}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{const ref=db.collection(col).doc(id);merge?await ref.update(data):await ref.set(data);return true}catch(e2){}}
    if(e&&e.code==="permission-denied"){denied=true;render();toast("Your email isn't on the team list yet. Ask Preeti to add it.");}
    else if(e&&e.code==="resource-exhausted")toast("Today's free database limit is used up. It resets tomorrow.");
    else toast("Couldn't save. Check your connection and try again.");
    return false}
}
async function remove(col,id){if(!db||readOnly)return;try{await db.collection(col).doc(id).delete()}catch(e){toast("Couldn't delete. Try again.")}}

// ---------- data subscription ----------
let raf=0;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
let jumped=false;
function intoMap(key){return snap=>{const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});S[key]=m;ready=true;
  if(key==="tasks"&&!jumped&&!snap.metadata?.fromCache){jumped=true;
    if(!Object.values(m).some(t=>t.week===ui.week)){for(let i=1;i<=3;i++){const w=addDays(ui.week,7*i);if(Object.values(m).some(t=>t.week===w)){ui.week=w;ui.month=weekMonth(w);toast("This week is empty, so the desk opened the week of "+fmtDay(w)+".");break}}}}
  render()}}
function anchor(){return ui.tab==="month"||ui.tab==="year"?ui.month+"-01":ui.week}
function syncTaskWindow(){
  if(!db)return;const a=iso(monday(parse(anchor())));
  const from=addDays(a,-42),to=addDays(a,49),key=from+to;
  if(key===taskWin)return;
  if(taskWin&&ui._from&&a>=addDays(ui._from,14)&&a<=addDays(ui._to,-14))return;
  taskWin=key;ui._from=from;ui._to=to;if(taskUnsub)taskUnsub();
  taskUnsub=fs.collection("tasks").where("week",">=",from).where("week","<=",to).onSnapshot(intoMap("tasks"),onErr);
}
function onErr(e){if(e&&e.code==="permission-denied"){denied=true;ready=true;render()}}

function stopSubs(){subs.forEach(u=>{try{u()}catch(e){}});subs=[];if(taskUnsub){taskUnsub();taskUnsub=null}taskWin=""}
function startSubs(){
  stopSubs();db=fs;denied=false;
  subs.push(fs.collection("people").onSnapshot(intoMap("people"),onErr));
  subs.push(fs.collection("projects").onSnapshot(intoMap("projects"),onErr));
  subs.push(fs.collection("goals").onSnapshot(intoMap("goals"),onErr));
  subs.push(fs.collection("reviews").where("week",">=",addDays(ui.week,-120)).onSnapshot(intoMap("reviews"),onErr));
  subs.push(fs.doc("meta/settings").onSnapshot(s=>{S.settings=s.exists?s.data():{};render()},onErr));
  syncTaskWindow();
}
async function signIn(){
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  try{await firebase.auth().signInWithPopup(provider)}
  catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"||e.code==="auth/cancelled-popup-request"))return firebase.auth().signInWithRedirect(provider);
    if(e&&e.code==="auth/unauthorized-domain")toast("This web address isn't allowed yet. Add it under Firebase > Authentication > Settings > Authorized domains.");
    else if(e&&e.code!=="auth/popup-closed-by-user")toast("Sign-in didn't work: "+(e.message||e.code));}
}
async function importStarter(){
  try{
    const res=await fetch("starter-plan.json",{cache:"no-store"});if(!res.ok)throw new Error("starter-plan.json not found next to index.html");
    const data=await res.json();const ops=[];

// ---------- REVIEW ----------
function viewReview(){
  const out=[h("div",{class:"bar"},weekNav(),whoChips())];
  const ps=ui.who==="all"?people():people().filter(p=>p.id===ui.who);
  for(const p of ps){
    const list=tasksFor(p.id,ui.week);const c=capacity(p);
    const doneH=list.filter(t=>t.status==="done").reduce((s,t)=>s+num(t.hours),0);
    const cnt=s=>list.filter(t=>t.status===s).length;
    const unfinished=list.filter(t=>["todo","doing","waiting","next"].includes(t.status)&&!t.repeat);
    const rid=ui.week+"_"+p.id;const r=S.reviews[rid]||{};
    const field=(k,label)=>h("div",{class:"field"},h("label",{for:rid+k},label),h("textarea",{id:rid+k,value:r[k]||"",onchange:e=>save("reviews",rid,clean({...(S.reviews[rid]||{}),week:ui.week,person:p.id,[k]:e.target.value}))}));
    const focusDone=list.filter(t=>t.focus&&t.status==="done").length,focusAll=list.filter(t=>t.focus).length;
    out.push(h("section",{class:"sheet"},
      h("div",{class:"person-head"},h("h3",{},p.name),h("span",{class:"tiny"},"Week of "+fmtDay(ui.week))),
      h("div",{class:"scroll"},h("table",{},h("tbody",{},
        h("tr",{},h("td",{},"Planned"),h("td",{class:"num"},hrs(planned(list))+" of "+hrs(c.avail))),
        h("tr",{},h("td",{},"Done"),h("td",{class:"num"},`${cnt("done")} tasks, ${hrs(doneH)}`)),
        h("tr",{},h("td",{},"Focus 3 done"),h("td",{class:"num"},`${focusDone} of ${focusAll}`)),
        h("tr",{},h("td",{},"Still open or waiting"),h("td",{class:"num"},String(unfinished.length))),
        h("tr",{},h("td",{},"Dropped"),h("td",{class:"num"},String(cnt("dropped"))))))),
      unfinished.length?h("p",{},h("button",{class:"btn primary",onclick:()=>rollForward(p.id,ui.week)},`Move ${unfinished.length} unfinished to next week`),h("span",{class:"tiny"}," First drop anything that no longer deserves time.")):h("p",{class:"tiny"},"Nothing left open."),
      h("div",{class:"row2"},field("momentum","What created momentum?"),field("leak","Biggest time leak")),
      field("change","One change for next week")));
  }
  return out;
}

// ---------- dialogs ----------
function dialog(title,fields,values,onSave,onDelete){
  const dlg=document.getElementById("dlg");
  const inputs={};
  const mk=f=>{
    const id="f_"+f.key;let el;
    if(f.type==="select")el=h("select",{id},f.options.map(([v,l])=>h("option",{value:v,selected:String(values[f.key]??"")===String(v)},l)));
    else if(f.type==="textarea")el=h("textarea",{id,value:values[f.key]??""});
    else if(f.type==="check"){el=h("input",{id,type:"checkbox",checked:!!values[f.key]});inputs[f.key]=el;return h("div",{class:"field check"},el,h("label",{for:id},f.label))}
    else el=h("input",{id,type:f.type||"text",value:values[f.key]??"",step:f.step,min:f.min,required:f.required});
    inputs[f.key]=el;return h("div",{class:"field"},h("label",{for:id},f.label),el)};
  const body=[];for(let i=0;i<fields.length;i++){const f=fields[i];if(f.half&&fields[i+1]?.half){body.push(h("div",{class:"row2"},mk(f),mk(fields[i+1])));i++}else body.push(mk(f))}
  const form=h("form",{method:"dialog",onsubmit:async e=>{e.preventDefault();const out={};for(const f of fields){const el=inputs[f.key];out[f.key]=f.type==="check"?el.checked:f.type==="number"?num(el.value):el.value.trim?el.value.trim():el.value}
      if(fields.some(f=>f.required&&!out[f.key])){toast("Add a title first.");return}
      if(await onSave(out)!==false)dlg.close()}},
    h("h3",{},title),...body,
    h("div",{class:"dlg-actions"},onDelete?h("button",{type:"button",class:"btn ghost",style:"color:var(--warn)",onclick:async e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tap again to delete";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Delete"}},4000);return}await onDelete();dlg.close()}},"Delete"):h("span"),
      h("div",{class:"chips"},h("button",{type:"button",class:"btn",onclick:()=>dlg.close()},"Cancel"),h("button",{type:"submit",class:"btn primary"},"Save"))));
  dlg.replaceChildren(form);dlg.showModal();setTimeout(()=>form.querySelector("input,select,textarea")?.focus(),30);
}
